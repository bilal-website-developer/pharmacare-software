appId: com.pharmacare.desktop
productName: Pharma Care
directories:
  output: release
files:
  - dist/**/*
  - renderer/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - "**/*.node"
npmRebuild: true
extraResources:
  - from: build/pharma-care.ico
    to: build/pharma-care.ico
  - from: build/icon.png
    to: build/icon.png
win:
  target:
    - nsis
  artifactName: "PharmaCare-${version}-Setup.${ext}"
  icon: build/pharma-care.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/pharma-care.ico
  uninstallerIcon: build/pharma-care.ico
  installerHeaderIcon: build/pharma-care.ico
