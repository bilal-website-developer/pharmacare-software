appId: com.pharmacare.desktop
productName: Pharma Care
directories:
  output: release
files:
  - dist/**/*
  - renderer/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - "**/*.node"
npmRebuild: true
win:
  target:
    - nsis
  artifactName: "PharmaCare-${version}-Setup.${ext}"
  icon: build/pharma-care.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
